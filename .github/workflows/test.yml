name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python modules
        run: python -m compileall -q pdfreader tests

      - name: Scan tracked files for likely secrets
        shell: pwsh
        run: |
          $matches = git grep -n -E 'sk-[A-Za-z0-9]{20,}|BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' -- ':!tests/*'
          if ($LASTEXITCODE -eq 0) {
            $matches
            throw 'Potential secret detected in tracked files.'
          }
          if ($LASTEXITCODE -ne 1) {
            throw "git grep failed with exit code $LASTEXITCODE"
          }
