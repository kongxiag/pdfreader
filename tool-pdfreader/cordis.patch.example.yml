# 把 dsh-tool-pdfreader 注册进 DSH profile 的 cordis.patch.yml（「插入列表」条目）。
#
# 步骤：
#   1) 安装包到 profile：dsh plugin --profile <name> add <本目录的绝对路径>
#   2) 把下面这段并入 <DSH_HOME>/profiles/<name>/cordis.patch.yml
#   3) 重启 DSH
#
# 说明：
#   - cwd / configPath 均可省略：cwd 自动定位到插件所在仓库根（link: 安装时），
#     configPath 自动尝试 <仓库根>/.agents/skills/pdfreader/config.json（存在才传）。
#   - 仅当 file:/npm 安装、或 config.json 在非标准位置时，才需显式填写 cwd / configPath。
#   - 翻译/视觉 API Key 一律从 config.json 读取，不进入工具参数。

- insert:
    - id: tool-pdfreader
      name: 'dsh-tool-pdfreader'
      config:
        # cwd: /path/to/pdf-reader            # 可选，默认自动定位
        # configPath: /path/to/config.json     # 可选，默认自动尝试仓库根下的 .agents/skills/pdfreader/config.json
        pythonBin: python
        defaultFormats: md,zh,html
        outDir: output
        timeoutMs: 600000
